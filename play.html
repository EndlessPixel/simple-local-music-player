<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/ionicons/ionicons.esm.js"></script>
    <script nomodule src="/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <input type="checkbox" id="menuToggle" class="menu-toggle" hidden>
    <label for="menuToggle" class="mobile-menu-toggle" title="歌曲列表">
        <ion-icon name="list" size="large"></ion-icon>
        <span class="mobile-menu-text">列表</span>
    </label>
    <label for="menuToggle" class="mobile-menu-backdrop" aria-hidden="true"></label>

    <div class="header-buttons">
        <a href="https://github.com/EndlessPixel/simple-local-music-player/" class="header-btn" target="_blank" rel="noopener noreferrer" title="GitHub">
            <ion-icon name="logo-github" size="small"></ion-icon>
        </a>
        <button class="header-btn" id="apiDocBtn" title="API文档">
            <ion-icon name="document-text" size="small"></ion-icon>
        </button>
        <button class="header-btn" id="changelogBtn" title="更新日志">
            <ion-icon name="git-compare" size="small"></ion-icon>
        </button>
    </div>

    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <ion-icon name="musical-notes" size="large"></ion-icon>
                    </div>
                    <span class="logo-text">Music Player</span>
                </div>
                <div class="search-wrapper">
                    <span class="search-icon">
                        <ion-icon name="search" size="small"></ion-icon>
                    </span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索音乐...">
                    <button class="refresh-btn" id="refreshBtn" title="刷新列表">
                        <ion-icon name="refresh-circle" size="small"></ion-icon>
                    </button>
                    <div class="search-history" id="searchHistory">
                        <div class="search-history-header">
                            <span class="search-history-title">搜索历史</span>
                            <button class="search-history-clear" id="clearHistoryBtn">清空全部</button>
                        </div>
                        <div class="search-history-list" id="searchHistoryList"></div>
                    </div>
                </div>
            </div>
            <div class="song-list-container">
                <div class="song-count" id="songCount">加载中...</div>
                <div class="song-list" id="songList">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <span>正在加载...</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-area">
                <div class="now-playing">
                    <div class="album-container">
                        <div class="album-art" id="albumArt">
                            <ion-icon name="musical-notes"></ion-icon>
                        </div>
                        <div class="album-glow"></div>
                    </div>
                    <div class="song-info-display">
                        <h1 class="current-title" id="currentTitle">未选择歌曲</h1>
                        <p class="current-artist" id="currentArtist"></p>
                        <p class="current-path" id="currentPath"></p>
                    </div>
                    <div class="visualizer-container">
                        <canvas id="visualizer" width="800" height="60"></canvas>
                    </div>
                </div>
            </div>

            <div class="player-bar">
                <div class="progress-section">
                    <span class="time-display" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill">
                            <div class="progress-handle"></div>
                        </div>
                    </div>
                    <span class="time-display" id="totalTime">0:00</span>
                </div>
                <div style="position: relative;">
                    <div class="controls-wrapper">
                        <button class="control-btn" id="prevBtn" title="上一首">
                            <ion-icon name="play-skip-back" size="small"></ion-icon>
                        </button>
                        <button class="control-btn play-btn" id="playBtn" title="播放">
                            <ion-icon class="icon-play" name="play" size="large"></ion-icon>
                            <ion-icon class="icon-pause" name="pause" size="large" style="display:none;"></ion-icon>
                        </button>
                        <button class="control-btn" id="nextBtn" title="下一首">
                            <ion-icon name="play-skip-forward" size="small"></ion-icon>
                        </button>
                        <button class="control-btn" id="playModeBtn" title="播放模式">
                            <ion-icon class="icon-repeat" name="repeat" size="small"></ion-icon>
                            <ion-icon class="icon-repeat-one" name="repeat" size="small" style="display:none;"></ion-icon>
                            <span class="repeat-one-badge" style="display:none;">1</span>
                            <ion-icon class="icon-shuffle" name="shuffle" size="small" style="display:none;"></ion-icon>
                        </button>
                        <button class="control-btn speed-btn" id="speedBtn" title="播放速度">
                            <span class="speed-label">1.0x</span>
                            <ion-icon name="chevron-up" size="small"></ion-icon>
                        </button>
                        <div class="speed-menu" id="speedMenu">
                            <button data-speed="0.25">0.25x</button>
                            <button data-speed="0.5">0.5x</button>
                            <button data-speed="0.75">0.75x</button>
                            <button data-speed="1.0">1.0x</button>
                            <button data-speed="1.25">1.25x</button>
                            <button data-speed="1.5">1.5x</button>
                            <button data-speed="1.75">1.75x</button>
                            <button data-speed="2.0">2.0x</button>
                        </div>
                        <button class="control-btn" id="downloadBtn" title="下载">
                            <ion-icon name="download" size="small"></ion-icon>
                        </button>
                        <button class="control-btn" id="shareBtn" title="复制分享链接">
                            <ion-icon name="share-social" size="small"></ion-icon>
                        </button>
                    </div>
                    <div class="side-controls">
                        <div class="volume-wrapper">
                            <span class="volume-icon">
                                <ion-icon class="icon-volume-high" name="volume-high" size="small"></ion-icon>
                                <ion-icon class="icon-volume-low" name="volume-medium" size="small" style="display:none;"></ion-icon>
                                <ion-icon class="icon-volume-mute" name="volume-mute" size="small" style="display:none;"></ion-icon>
                            </span>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="changelog-panel" id="changelogPanel">
        <div class="changelog-header">
            <h3>更新日志</h3>
            <button class="changelog-close" id="changelogClose">
                <ion-icon name="close" size="small"></ion-icon>
            </button>
        </div>
        <div class="changelog-content" id="changelogContent">
            <div class="loading-container">
                <div class="spinner"></div>
                <span>正在加载...</span>
            </div>
        </div>
        <div class="changelog-pagination" id="changelogPagination"></div>
    </div>
    <div class="changelog-overlay" id="changelogOverlay"></div>

    <div class="apidoc-panel" id="apidocPanel">
        <div class="changelog-header">
            <h3>API 文档</h3>
            <button class="changelog-close" id="apidocClose">
                <ion-icon name="close" size="small"></ion-icon>
            </button>
        </div>
        <div class="apidoc-content" id="apidocContent">
            <div class="loading-container">
                <div class="spinner"></div>
                <span>正在加载...</span>
            </div>
        </div>
    </div>
    <div class="changelog-overlay" id="apidocOverlay"></div>

    <audio id="audioPlayer">

    <script src="script.js"></script>
</body>
</html>
