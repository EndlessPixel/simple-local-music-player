<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>

    <a href="https://github.com/EndlessPixel/simple-local-music-player/" class="github-link" target="_blank" rel="noopener noreferrer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
    </a>

    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18V5l12-2v13"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                    </div>
                    <span class="logo-text">Music Player</span>
                </div>
                <div class="search-wrapper">
                    <span class="search-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                    </span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索音乐...">
                    <button class="refresh-btn" id="refreshBtn" title="刷新列表">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                            <path d="M16 21h5v-5"/>
                        </svg>
                    </button>
                    <div class="search-history" id="searchHistory">
                        <div class="search-history-header">
                            <span class="search-history-title">搜索历史</span>
                            <button class="search-history-clear" id="clearHistoryBtn">清空全部</button>
                        </div>
                        <div class="search-history-list" id="searchHistoryList"></div>
                    </div>
                </div>
            </div>
            <div class="song-list-container">
                <div class="song-count" id="songCount">加载中...</div>
                <div class="song-list" id="songList">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <span>正在加载...</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <div class="content-area">
                <div class="now-playing">
                    <div class="album-container">
                        <div class="album-art" id="albumArt">
                            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18V5l12-2v13"/>
                                <circle cx="6" cy="18" r="3"/>
                                <circle cx="18" cy="16" r="3"/>
                            </svg>
                        </div>
                        <div class="album-glow"></div>
                    </div>
                    <div class="song-info-display">
                        <h1 class="current-title" id="currentTitle">未选择歌曲</h1>
                        <p class="current-artist" id="currentArtist"></p>
                        <p class="current-path" id="currentPath"></p>
                    </div>
                </div>
            </div>

            <!-- 播放器控制 -->
            <div class="player-bar">
                <div class="progress-section">
                    <span class="time-display" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill">
                            <div class="progress-handle"></div>
                        </div>
                    </div>
                    <span class="time-display" id="totalTime">0:00</span>
                </div>
                <div style="position: relative;">
                    <div class="controls-wrapper">
                        <button class="control-btn" id="shuffleBtn" title="随机播放">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 3h5v5"/>
                                <path d="M4 20 21 3"/>
                                <path d="M21 16v5h-5"/>
                                <path d="M15 15 21 21"/>
                                <path d="M4 4l5 5"/>
                            </svg>
                        </button>
                        <button class="control-btn" id="prevBtn" title="上一首">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="19 20 9 12 19 4 19 20"/>
                                <line x1="5" x2="5" y1="19" y2="5"/>
                            </svg>
                        </button>
                        <button class="control-btn play-btn" id="playBtn" title="播放">
                            <svg class="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            <svg class="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                                <rect x="6" y="4" width="4" height="16"/>
                                <rect x="14" y="4" width="4" height="16"/>
                            </svg>
                        </button>
                        <button class="control-btn" id="nextBtn" title="下一首">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 4 15 12 5 20 5 4"/>
                                <line x1="19" x2="19" y1="5" y2="19"/>
                            </svg>
                        </button>
                        <button class="control-btn" id="repeatBtn" title="循环">
                            <svg class="icon-repeat" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m17 2 4 4-4 4"/>
                                <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
                                <path d="m7 22-4-4 4-4"/>
                                <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
                            </svg>
                            <svg class="icon-repeat-one" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="m17 2 4 4-4 4"/>
                                <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
                                <path d="m7 22-4-4 4-4"/>
                                <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
                                <text x="12" y="14" font-size="8" font-weight="600" fill="currentColor" text-anchor="middle">1</text>
                            </svg>
                        </button>
                        <button class="control-btn" id="downloadBtn" title="下载">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" x2="12" y1="15" y2="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="side-controls">
                        <div class="volume-wrapper">
                            <span class="volume-icon">
                                <svg class="icon-volume-high" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                </svg>
                                <svg class="icon-volume-low" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                </svg>
                                <svg class="icon-volume-mute" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <line x1="23" x2="17" y1="9" y2="15"/>
                                    <line x1="17" x2="23" y1="9" y2="15"/>
                                </svg>
                            </span>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // 播放器状态
        const state = {
            songs: {},
            flatSongs: [],
            currentIndex: -1,
            isPlaying: false,
            isShuffle: false,
            repeatMode: 0,
            collapsedFolders: new Set(),
            refreshCountdown: 30,
            refreshInterval: null,
            searchHistory: [],
            lastSearchTerm: ''
        };

        const SEARCH_HISTORY_KEY = 'musicSearchHistory';
        const MAX_SEARCH_HISTORY = 20;

        // DOM 元素
        const audio = document.getElementById('audioPlayer');
        const songList = document.getElementById('songList');
        const songCount = document.getElementById('songCount');
        const searchInput = document.getElementById('searchInput');
        const refreshBtn = document.getElementById('refreshBtn');
        const searchHistoryEl = document.getElementById('searchHistory');
        const searchHistoryList = document.getElementById('searchHistoryList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const currentTitleEl = document.getElementById('currentTitle');
        const currentArtistEl = document.getElementById('currentArtist');
        const currentPathEl = document.getElementById('currentPath');
        const albumArt = document.getElementById('albumArt');
        const volumeSlider = document.getElementById('volumeSlider');

        // 初始化
        async function init() {
            try {
                // 恢复折叠状态
                const savedCollapsed = localStorage.getItem('collapsedFolders');
                if (savedCollapsed) {
                    try {
                        state.collapsedFolders = new Set(JSON.parse(savedCollapsed));
                    } catch {
                        state.collapsedFolders = new Set();
                    }
                }

                // 加载搜索历史
                loadSearchHistory();

                const res = await fetch('/api/songs');
                state.songs = await res.json();
                renderSongList(state.songs);
                startAutoRefresh();

                const savedVolume = localStorage.getItem('musicVolume');
                const volume = savedVolume ? parseInt(savedVolume) : 80;
                volumeSlider.value = volume;
                audio.volume = volume / 100;
                updateVolumeIcon(volume);
            } catch (err) {
                songList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="15" x2="9" y1="9" y2="15"/>
                                <line x1="9" x2="15" y1="9" y2="15"/>
                            </svg>
                        </div>
                        <div class="empty-text">加载失败，请刷新重试</div>
                    </div>
                `;
                console.error('加载音乐列表失败:', err);
            }
        }

        // 渲染歌曲列表
        function renderSongList(songs, filter = '') {
            const currentScroll = songList.scrollTop;
            
            let currentSong = null;
            if (state.currentIndex >= 0 && state.flatSongs[state.currentIndex]) {
                const s = state.flatSongs[state.currentIndex];
                currentSong = { folder: s.folder, song: s.song };
            }
            
            songList.innerHTML = '';
            state.flatSongs = [];
            let totalSongs = 0;

            const folders = Object.keys(songs).sort((a, b) => {
                if (a === '.') return -1;
                if (b === '.') return 1;
                return a.localeCompare(b);
            });

            for (const folder of folders) {
                const songsInFolder = songs[folder].filter(name =>
                    filter === '' || name.toLowerCase().includes(filter.toLowerCase())
                );

                if (songsInFolder.length === 0) continue;

                const isCollapsed = state.collapsedFolders.has(folder);
                const group = document.createElement('div');
                group.className = 'folder-group' + (isCollapsed ? ' collapsed' : '');

                const header = document.createElement('div');
                header.className = 'folder-header';
                header.dataset.folder = folder;
                header.innerHTML = `
                    <span class="folder-toggle">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </span>
                    <span class="folder-icon">
                        ${folder === '.' ? 
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' :
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5a2 2 0 0 1-2-2"/><path d="M4 20V4a2 2 0 0 1 2-2h5"/></svg>'
                        }
                    </span>
                    <span>${folder === '.' ? '根目录' : folder}</span>
                    <span style="margin-left: auto; opacity: 0.5;">${songsInFolder.length}</span>
                `;
                group.appendChild(header);

                const songsContainer = document.createElement('div');
                songsContainer.className = 'folder-songs' + (isCollapsed ? ' collapsed' : '');

                const sortedSongs = [...songsInFolder].sort();
                for (const song of sortedSongs) {
                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.dataset.index = state.flatSongs.length;
                    item.dataset.folder = folder;
                    item.dataset.song = song;

                    const num = document.createElement('span');
                    num.className = 'song-num';
                    num.textContent = String(totalSongs + 1).padStart(2, '0');

                    const playIcon = document.createElement('span');
                    playIcon.className = 'song-play';
                    playIcon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';

                    const info = document.createElement('div');
                    info.className = 'song-info';

                    const title = document.createElement('div');
                    title.className = 'song-title-text';
                    title.textContent = song.replace(/\.[^.]+$/, '');

                    const folderName = document.createElement('div');
                    folderName.className = 'song-folder';
                    folderName.textContent = folder === '.' ? '根目录' : folder;

                    info.appendChild(title);
                    info.appendChild(folderName);
                    item.appendChild(num);
                    item.appendChild(playIcon);
                    item.appendChild(info);
                    songsContainer.appendChild(item);

                    state.flatSongs.push({ folder, song });
                    totalSongs++;
                }

                group.appendChild(songsContainer);
                songList.appendChild(group);
            }

            songCount.innerHTML = `
                <span>共 ${totalSongs} 首歌曲</span>
                <span class="auto-refresh" id="autoRefresh">自动刷新: ${state.refreshCountdown}s</span>
            `;

            if (totalSongs === 0) {
                songList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M9 18V5l12-2v13"/>
                                <circle cx="6" cy="18" r="3"/>
                                <circle cx="18" cy="16" r="3"/>
                            </svg>
                        </div>
                        <div class="empty-text">${filter ? '没有找到匹配的歌曲' : '将音乐文件放入 music 文件夹'}</div>
                    </div>
                `;
            }

            songList.scrollTop = currentScroll;
            updateActiveItem(currentSong);
        }

        // 更新当前播放项高亮
        function updateActiveItem(currentSong) {
            if (!currentSong || state.flatSongs.length === 0) return;
            
            let newIndex = -1;
            for (let i = 0; i < state.flatSongs.length; i++) {
                if (state.flatSongs[i].folder === currentSong.folder && 
                    state.flatSongs[i].song === currentSong.song) {
                    newIndex = i;
                    break;
                }
            }
            
            if (newIndex === -1) return;
            
            state.currentIndex = newIndex;
            
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            
            const allItems = document.querySelectorAll('.song-item');
            for (const item of allItems) {
                if (item.dataset.folder === currentSong.folder && item.dataset.song === currentSong.song) {
                    item.classList.add('active');
                    break;
                }
            }
        }

        // 自动刷新
        function startAutoRefresh() {
            if (state.refreshInterval) return;
            state.refreshInterval = setInterval(() => {
                state.refreshCountdown--;
                const autoRefreshEl = document.getElementById('autoRefresh');
                if (autoRefreshEl) {
                    autoRefreshEl.textContent = `自动刷新: ${state.refreshCountdown}s`;
                }
                if (state.refreshCountdown <= 0) {
                    state.refreshCountdown = 30;
                    refreshSongList();
                }
            }, 1000);
        }

        async function refreshSongList() {
            try {
                const res = await fetch('/api/songs');
                state.songs = await res.json();
                renderSongList(state.songs, searchInput.value);
            } catch (err) {
                console.error('刷新失败:', err);
            }
        }

        let currentCoverUrl = null;

        // 清理封面 URL
        function clearCoverUrl() {
            if (currentCoverUrl) {
                URL.revokeObjectURL(currentCoverUrl);
                currentCoverUrl = null;
            }
        }

        // 请求封面
        async function loadCover(folder, song) {
            clearCoverUrl();
            
            const params = new URLSearchParams();
            if (folder !== '.') {
                params.set('folder', folder);
            }
            params.set('song', song);
            
            try {
                const res = await fetch(`/api/cover?${params.toString()}`);
                if (res.ok) {
                    const blob = await res.blob();
                    currentCoverUrl = URL.createObjectURL(blob);
                    albumArt.innerHTML = `<img src="${currentCoverUrl}" alt="封面" style="width:100%;height:100%;object-fit:cover;border-radius:24px;">`;
                    return;
                }
            } catch {
            }
            
            albumArt.innerHTML = `
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
            `;
        }

        // 加载元数据（歌手、时长）
        async function loadMeta(folder, song) {
            const params = new URLSearchParams();
            if (folder !== '.') {
                params.set('folder', folder);
            }
            params.set('song', song);
            
            try {
                const res = await fetch(`/api/meta?${params.toString()}`);
                if (res.ok) {
                    const meta = await res.json();
                    
                    // 显示歌手
                    if (meta.artist) {
                        currentArtistEl.textContent = meta.artist;
                    } else {
                        currentArtistEl.textContent = '';
                    }
                    
                    // 显示时长
                    if (meta.duration) {
                        totalTimeEl.textContent = formatTime(meta.duration);
                    }
                }
            } catch {
            }
        }

        // 播放歌曲
        function playSong(index) {
            if (index < 0 || index >= state.flatSongs.length) return;

            state.currentIndex = index;
            const { folder, song } = state.flatSongs[index];
            const path = folder === '.' ? `/${song}` : `/${folder}/${song}`;

            audio.src = encodeURI(path);
            audio.play();
            state.isPlaying = true;
            updatePlayButton();
            loadCover(folder, song);
            loadMeta(folder, song);

            updateActiveItem({ folder, song });
            scrollToFolder(folder);

            currentTitleEl.textContent = song.replace(/\.[^.]+$/, '');
            const pathDisplay = folder === '.' ? song : `${folder}/${song}`;
            currentPathEl.textContent = pathDisplay;
            albumArt.classList.add('playing');
        }

        // 滚动到指定文件夹
        function scrollToFolder(folder) {
            // 找到对应的文件夹组
            const folderGroups = songList.querySelectorAll('.folder-group');
            let targetGroup = null;

            folderGroups.forEach(group => {
                const header = group.querySelector('.folder-header');
                if (header && header.dataset.folder === folder) {
                    targetGroup = group;
                }
            });

            if (!targetGroup) return;

            // 如果文件夹是折叠状态，先展开
            if (targetGroup.classList.contains('collapsed')) {
                state.collapsedFolders.delete(folder);
                localStorage.setItem('collapsedFolders', JSON.stringify([...state.collapsedFolders]));
                targetGroup.classList.remove('collapsed');
                const songsContainer = targetGroup.querySelector('.folder-songs');
                if (songsContainer) {
                    songsContainer.classList.remove('collapsed');
                }
            }

            // 检查是否在可视区域内
            const containerRect = songList.getBoundingClientRect();
            const groupRect = targetGroup.getBoundingClientRect();

            // 如果文件夹不在可视区域顶部位置，滚动到顶部
            if (groupRect.top < containerRect.top || groupRect.top > containerRect.top + 100) {
                songList.scrollTo({
                    top: targetGroup.offsetTop - 10,
                    behavior: 'smooth'
                });
            }
        }

        // 更新播放按钮
        function updatePlayButton() {
            const iconPlay = playBtn.querySelector('.icon-play');
            const iconPause = playBtn.querySelector('.icon-pause');
            iconPlay.style.display = state.isPlaying ? 'none' : 'block';
            iconPause.style.display = state.isPlaying ? 'block' : 'none';
        }

        // 更新音量图标
        function updateVolumeIcon(volume) {
            const high = document.querySelector('.icon-volume-high');
            const low = document.querySelector('.icon-volume-low');
            const mute = document.querySelector('.icon-volume-mute');
            high.style.display = volume > 50 ? 'block' : 'none';
            low.style.display = volume > 0 && volume <= 50 ? 'block' : 'none';
            mute.style.display = volume === 0 ? 'block' : 'none';
        }

        // 更新循环按钮图标
        function updateRepeatButton() {
            const iconRepeat = repeatBtn.querySelector('.icon-repeat');
            const iconRepeatOne = repeatBtn.querySelector('.icon-repeat-one');
            iconRepeat.style.display = state.repeatMode !== 2 ? 'block' : 'none';
            iconRepeatOne.style.display = state.repeatMode === 2 ? 'block' : 'none';
        }

        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 获取下一首
        function getNextIndex() {
            if (state.isShuffle) {
                let next;
                do {
                    next = Math.floor(Math.random() * state.flatSongs.length);
                } while (next === state.currentIndex && state.flatSongs.length > 1);
                return next;
            }
            return (state.currentIndex + 1) % state.flatSongs.length;
        }

        // 获取上一首
        function getPrevIndex() {
            if (state.isShuffle) {
                let prev;
                do {
                    prev = Math.floor(Math.random() * state.flatSongs.length);
                } while (prev === state.currentIndex && state.flatSongs.length > 1);
                return prev;
            }
            return (state.currentIndex - 1 + state.flatSongs.length) % state.flatSongs.length;
        }

        // 事件监听
        playBtn.addEventListener('click', () => {
            if (state.currentIndex === -1 && state.flatSongs.length > 0) {
                playSong(0);
            } else if (state.isPlaying) {
                audio.pause();
                state.isPlaying = false;
            } else {
                audio.play();
                state.isPlaying = true;
            }
            updatePlayButton();
        });

        prevBtn.addEventListener('click', () => {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                playSong(getPrevIndex());
            }
        });

        nextBtn.addEventListener('click', () => {
            playSong(getNextIndex());
        });

        shuffleBtn.addEventListener('click', () => {
            state.isShuffle = !state.isShuffle;
            shuffleBtn.classList.toggle('active', state.isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            state.repeatMode = (state.repeatMode + 1) % 3;
            repeatBtn.classList.toggle('active', state.repeatMode > 0);
            updateRepeatButton();
        });

        downloadBtn.addEventListener('click', () => {
            if (state.currentIndex === -1) return;
            
            const { folder, song } = state.flatSongs[state.currentIndex];
            const path = folder === '.' ? `/${song}` : `/${folder}/${song}`;
            
            const link = document.createElement('a');
            link.href = encodeURI(path);
            link.download = song;
            link.click();
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        volumeSlider.addEventListener('input', () => {
            const volume = parseInt(volumeSlider.value);
            audio.volume = volume / 100;
            updateVolumeIcon(volume);
            localStorage.setItem('musicVolume', volume.toString());
        });

        searchInput.addEventListener('input', (e) => {
            const value = e.target.value;
            renderSongList(state.songs, value);
            if (value.trim()) {
                showSearchHistory();
            } else {
                hideSearchHistory();
            }
        });

        searchInput.addEventListener('focus', () => {
            if (state.searchHistory.length > 0) {
                showSearchHistory();
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const term = searchInput.value.trim();
                if (term) {
                    addSearchHistory(term);
                }
                hideSearchHistory();
                searchInput.blur();
            } else if (e.key === 'Escape') {
                hideSearchHistory();
                searchInput.blur();
            }
        });

        // 点击其他区域关闭搜索历史
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                hideSearchHistory();
            }
        });

        // 阻止搜索历史区域的点击事件冒泡
        searchHistoryEl.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // 搜索历史相关函数
        function loadSearchHistory() {
            try {
                const saved = localStorage.getItem(SEARCH_HISTORY_KEY);
                if (saved) {
                    state.searchHistory = JSON.parse(saved);
                }
            } catch {
                state.searchHistory = [];
            }
            renderSearchHistory();
        }

        function saveSearchHistory() {
            localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(state.searchHistory));
        }

        function addSearchHistory(term) {
            // 不记录空搜索或仅包含空格的搜索
            const trimmed = term.trim();
            if (!trimmed) return;

            // 避免记录重复的连续搜索关键词
            if (state.lastSearchTerm === trimmed) return;
            state.lastSearchTerm = trimmed;

            // 移除已存在的相同记录（后面会添加到最前面）
            state.searchHistory = state.searchHistory.filter(h => h.term !== trimmed);

            // 添加到最前面
            state.searchHistory.unshift({
                term: trimmed,
                timestamp: Date.now()
            });

            // 限制最大条数
            if (state.searchHistory.length > MAX_SEARCH_HISTORY) {
                state.searchHistory = state.searchHistory.slice(0, MAX_SEARCH_HISTORY);
            }

            saveSearchHistory();
            renderSearchHistory();
        }

        function deleteSearchHistory(index, event) {
            event.stopPropagation();
            const items = searchHistoryList.querySelectorAll('.search-history-item');
            const item = items[index];
            if (item) {
                item.classList.add('removing');
                setTimeout(() => {
                    state.searchHistory.splice(index, 1);
                    saveSearchHistory();
                    renderSearchHistory();
                }, 250);
            }
        }

        function clearAllSearchHistory() {
            if (state.searchHistory.length === 0) return;
            if (confirm('确定要清空所有搜索历史吗？')) {
                const items = searchHistoryList.querySelectorAll('.search-history-item');
                items.forEach((item, i) => {
                    setTimeout(() => {
                        item.classList.add('removing');
                    }, i * 50);
                });
                setTimeout(() => {
                    state.searchHistory = [];
                    saveSearchHistory();
                    renderSearchHistory();
                }, 250 + items.length * 50);
            }
        }

        function showSearchHistory() {
            renderSearchHistory();
            searchHistoryEl.classList.add('show');
        }

        function hideSearchHistory() {
            searchHistoryEl.classList.remove('show');
        }

        function renderSearchHistory() {
            if (state.searchHistory.length === 0) {
                searchHistoryList.innerHTML = `
                    <div class="search-history-empty">暂无搜索历史</div>
                `;
                clearHistoryBtn.style.display = 'none';
                return;
            }

            clearHistoryBtn.style.display = 'block';
            searchHistoryList.innerHTML = state.searchHistory.map((item, index) => `
                <div class="search-history-item" data-index="${index}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <span class="search-history-text">${escapeHtml(item.term)}</span>
                    <button class="search-history-delete" data-index="${index}" title="删除">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            `).join('');

            // 绑定点击事件
            searchHistoryList.querySelectorAll('.search-history-item').forEach((item, index) => {
                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-history-delete')) {
                        const term = state.searchHistory[index].term;
                        searchInput.value = term;
                        renderSongList(state.songs, term);
                        hideSearchHistory();
                    }
                });
            });

            searchHistoryList.querySelectorAll('.search-history-delete').forEach((btn, index) => {
                btn.addEventListener('click', (e) => deleteSearchHistory(index, e));
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        clearHistoryBtn.addEventListener('click', clearAllSearchHistory);

        refreshBtn.addEventListener('click', async () => {
            refreshBtn.classList.add('loading');
            try {
                await refreshSongList();
                state.refreshCountdown = 30;
            } catch (err) {
                console.error('刷新失败:', err);
            } finally {
                refreshBtn.classList.remove('loading');
            }
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (state.repeatMode === 2) {
                audio.currentTime = 0;
                audio.play();
            } else if (state.repeatMode === 1 || state.currentIndex < state.flatSongs.length - 1) {
                playSong(getNextIndex());
            } else {
                state.isPlaying = false;
                updatePlayButton();
                albumArt.classList.remove('playing');
            }
        });

        audio.addEventListener('pause', () => {
            albumArt.classList.remove('playing');
        });

        audio.addEventListener('play', () => {
            albumArt.classList.add('playing');
        });

        // 键盘快捷键
        function handleKeydown(e) {
            if (e.target.tagName === 'INPUT') return;

            switch (e.code) {
                case 'Space':
                    e.preventDefault();
                    playBtn.click();
                    break;
                case 'ArrowLeft':
                    audio.currentTime = Math.max(0, audio.currentTime - 5);
                    break;
                case 'ArrowRight':
                    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    volumeSlider.value = Math.min(100, parseInt(volumeSlider.value) + 5);
                    audio.volume = volumeSlider.value / 100;
                    updateVolumeIcon(parseInt(volumeSlider.value));
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    volumeSlider.value = Math.max(0, parseInt(volumeSlider.value) - 5);
                    audio.volume = volumeSlider.value / 100;
                    updateVolumeIcon(parseInt(volumeSlider.value));
                    break;
            }
        }
        document.addEventListener('keydown', handleKeydown);

        function handleSongListClick(e) {
            const folderHeader = e.target.closest('.folder-header');
            if (folderHeader) {
                e.stopPropagation();
                const folder = folderHeader.dataset.folder;
                const group = folderHeader.parentElement;
                const songsContainer = group.querySelector('.folder-songs');
                
                if (state.collapsedFolders.has(folder)) {
                    state.collapsedFolders.delete(folder);
                } else {
                    state.collapsedFolders.add(folder);
                }
                localStorage.setItem('collapsedFolders', JSON.stringify([...state.collapsedFolders]));
                group.classList.toggle('collapsed');
                songsContainer.classList.toggle('collapsed');
                return;
            }

            const songItem = e.target.closest('.song-item');
            if (songItem) {
                playSong(parseInt(songItem.dataset.index));
            }
        }

        songList.addEventListener('click', handleSongListClick);

        // 清理函数
        function cleanup() {
            if (state.refreshInterval) {
                clearInterval(state.refreshInterval);
                state.refreshInterval = null;
            }
            document.removeEventListener('keydown', handleKeydown);
            songList.removeEventListener('click', handleSongListClick);
            clearCoverUrl();
            audio.pause();
            audio.src = '';
        }

        window.addEventListener('beforeunload', cleanup);

        // 启动
        init();
    </script>
</body>
</html>
