<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 外封套阴影 -->
  <defs>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="60%" stop-color="#111"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="grooveShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#888" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#222" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 黑胶主体 -->
  <circle cx="200" cy="200" r="180" fill="url(#vinylGlow)" filter="url(#shadow)"/>

  <!-- 纹理圈（模拟沟槽） -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#222" stroke-width="0.6"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#252525" stroke-width="0.5"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#1a1a1a" stroke-width="0.7"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#222" stroke-width="0.6"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#252525" stroke-width="0.5"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#1a1a1a" stroke-width="0.7"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#222" stroke-width="0.6"/>

  <!-- 反光层 -->
  <circle cx="200" cy="200" r="175" fill="url(#grooveShine)"/>

  <!-- 标签贴纸 -->
  <circle cx="200" cy="200" r="55" fill="#007aff"/>
  <circle cx="200" cy="200" r="48" fill="#2f96ff"/>

  <!-- 中心孔 -->
  <circle cx="200" cy="200" r="4" fill="#000"/>

  <!-- 高光弧线 -->
  <ellipse cx="200" cy="200" rx="160" ry="160" fill="none" stroke="#666" stroke-width="1.5" opacity="0.15" transform="rotate(-30 200 200)"/>
  <ellipse cx="200" cy="200" rx="140" ry="140" fill="none" stroke="#555" stroke-width="1" opacity="0.1" transform="rotate(45 200 200)"/>
</svg>
