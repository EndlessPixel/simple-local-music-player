<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width,initial-scale=1.0"><title>音乐播放器</title><script src="https://cdn.tailwindcss.com"></script><style>#list::-webkit-scrollbar{width:10px}#list::-webkit-scrollbar-track{background:#1f1f1f}#list::-webkit-scrollbar-thumb{background:#10b981}</style></head><body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4"><div class="w-full max-w-3xl mb-4"><input id="search"placeholder="搜索歌曲名称"class="w-full px-4 py-2 rounded-full bg-gray-800 text-white  border-gray-700 outline-none"></div><div class="flex gap-2 flex-wrap justify-center mb-4"><button onclick="loadSongs()"class="px-5 py-2 bg-green-500 rounded-full">刷新列表</button><button id="prev"disabled onclick="prev()"class="px-5 py-2 bg-emerald-500 rounded-full disabled:bg-gray-700">上一曲</button><button id="next"disabled onclick="next()"class="px-5 py-2 bg-emerald-500 rounded-full disabled:bg-gray-700">下一曲</button><button id="loop"disabled onclick="toggleLoop()"class="px-5 py-2 bg-cyan-500 rounded-full disabled:bg-gray-700">列表循环</button></div><div id="status"class="text-green-400 text-center mb-3">加载中...</div><div id="list"class="w-full max-w-5xl max-h-[60vh] overflow-y-auto bg-gray-800  border-gray-700 rounded-xl p-3 mb-4"></div><audio id="player"class="w-full max-w-3xl"controls></audio><script src="script.js"></script></body></html>
